<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prijava - DronePilot Services</title>
    
    <!-- Bootstrap 5 CSS za lijep dizajn forme -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS za naš custom modal koji uvijek radi -->
    <style>
        .custom-modal-overlay {
            display: none; /* Sakriveno dok se ne klikne */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5); /* Zatamnjena pozadina */
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        .custom-modal-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 400px;
            max-width: 90%;
            text-align: center;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.3);
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center min-vh-100 py-5">
        <div class="col-12 col-md-8 col-lg-5">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body p-4 p-sm-5">
                    
                    <!-- Zaglavlje -->
                    <div class="text-center mb-4">
                        <div class="bg-primary bg-gradient text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px;">
                            <i class="bi bi-airplane-engines fs-2"></i>
                        </div>
                        <h3 class="fw-bold text-dark">DronePilot</h3>
                        <p class="text-muted">Prijavite se na vaš nalog</p>
                    </div>

                    <!-- Forma -->
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Email adresa</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="email" value="haris@stu.ibu.edu.ba" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Lozinka</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="password" value="Password123!" required>
                            </div>
                        </div>

                        <button type="submit" id="openModalBtn" class="btn btn-primary w-100 py-2 fw-bold rounded-3 shadow-sm">
                            <i class="bi bi-box-arrow-in-right me-2"></i> Prijavi se
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <span class="text-muted">Nemate nalog?</span>
                        <a href="register.html" class="fw-semibold text-primary text-decoration-none">Registrujte se</a>
                    </div>

                    <div class="text-center mt-3">
                        <a href="index.html" class="text-secondary text-decoration-none">
                            <i class="bi bi-arrow-left me-1"></i> Nazad na početnu
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Naš vlastiti Modal (Popup) -->
    <div id="myCustomModal" class="custom-modal-overlay">
        <div class="custom-modal-box">
            <div class="text-success mb-3">
                <i class="bi bi-check-circle-fill display-1"></i>
            </div>
            <h4 class="fw-bold text-dark">Uspješna Prijava!</h4>
            <p class="text-muted mb-4">Uspješno ste simulirali prijavu na sistem DronePilot Services.</p>
            <button type="button" id="closeModalBtn" class="btn btn-success rounded-pill px-5 fw-bold">U redu</button>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');

        loginForm.addEventListener('submit', function (event) {
            event.preventDefault();

            const email = emailInput.value.trim().toLowerCase();
            const password = passwordInput.value.trim();

            if (!email || !password) {
                alert('Unesite email i lozinku.');
                return;
            }

            const isAdmin = email.includes('admin') || email === 'admin@dronpilot.ba';
            const role = isAdmin ? 'admin' : 'user';

            localStorage.setItem('dronepilot_user', JSON.stringify({
                email,
                role,
                name: isAdmin ? 'Admin korisnik' : 'Haris Kovačević'
            }));

            if (isAdmin) {
                window.location.href = 'admin.html';
            } else {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
