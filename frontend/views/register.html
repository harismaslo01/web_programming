<div class="auth-wrapper">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">
                    <div class="card auth-card shadow-lg border-0">
                        <div class="card-body p-4 p-sm-5">
                            <div class="text-center mb-4">
                                <div class="bg-primary bg-gradient text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3 auth-icon">
                                    <i class="bi bi-airplane-engines fs-2"></i>
                                </div>
                                <h3 class="fw-bold text-dark">DronePilot</h3>
                                <p class="text-muted mb-0">Kreirajte vaš nalog</p>
                            </div>

                            <form id="registerForm">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Ime i prezime</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                                            <input type="text" class="form-control" placeholder="Vaše ime" required>
                                        </div>
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Telefon</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light"><i class="bi bi-telephone"></i></span>
                                            <input type="tel" class="form-control" placeholder="+387 62 123 456" required>
                                        </div>
                                    </div>

                                    <div class="col-12">
                                        <label class="form-label fw-semibold">Email adresa</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                                            <input type="email" class="form-control" placeholder="npr. korisnik@email.com" required>
                                        </div>
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Lozinka</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                                            <input type="password" class="form-control" placeholder="Unesite lozinku" required>
                                        </div>
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Potvrda lozinke</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light"><i class="bi bi-lock-fill"></i></span>
                                            <input type="password" class="form-control" placeholder="Ponovite lozinku" required>
                                        </div>
                                    </div>

                                    <div class="col-12">
                                        <label class="form-label fw-semibold">Uloga</label>
                                        <select class="form-select" aria-label="Odaberite ulogu">
                                            <option selected>Klijent</option>
                                            <option>Administrator</option>
                                        </select>
                                    </div>
                                </div>

                                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold rounded-3 shadow-sm mt-4">
                                    <i class="bi bi-person-plus me-2"></i> Registruj se
                                </button>
                            </form>

                            <div class="text-center mt-4">
                                <span class="text-muted">Već imate nalog?</span>
                                <a href="#/login" class="fw-semibold text-primary text-decoration-none ms-1">Prijavite se</a>
                            </div>

                            <div class="text-center mt-3">
                                <a href="#/home" class="text-secondary text-decoration-none">
                                    <i class="bi bi-arrow-left me-1"></i> Nazad na početnu
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
