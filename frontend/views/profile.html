<main class="container py-5">
        <div class="row g-4">
            <div class="col-lg-4">
                <div class="card border-0 shadow-sm rounded-4 h-100">
                    <div class="card-body p-4 text-center">
                        <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3 profile-avatar">
                            <i class="bi bi-person-fill"></i>
                        </div>
                        <h2 class="h4 fw-bold">Haris Kovačević</h2>
                        <p class="text-muted mb-3">Klijent / Operater</p>
                        <span class="badge bg-primary-subtle text-primary rounded-pill px-3 py-2">Aktivan</span>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card border-0 shadow-sm rounded-4 h-100">
                    <div class="card-body p-4">
                        <h3 class="h4 fw-bold mb-4">Detalji profila</h3>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Ime i prezime</label>
                                <input type="text" class="form-control" value="Haris Kovačević" readonly>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Email</label>
                                <input type="email" class="form-control" value="haris@dronpilot.ba" readonly>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Telefon</label>
                                <input type="tel" class="form-control" value="+387 62 123 456" readonly>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Uloga</label>
                                <input type="text" class="form-control" value="Klijent" readonly>
                            </div>
                        </div>
                        <div class="mt-4 d-flex gap-2">
                            <button class="btn btn-primary rounded-pill px-4">Uredi profil</button>
                            <button class="btn btn-outline-secondary rounded-pill px-4">Promijeni lozinku</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
