<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DronePilot Services - profesionalno snimanje, inspekcija i mapiranje dronom.">
    <title>DronePilot Services</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="frontend/css/style.css">
</head>
<body class="bg-light">
    <!-- One shared navbar for every page; main.js only updates it (active link, login state). -->
    <nav id="mainNavbar" class="navbar navbar-expand-lg navbar-dark app-navbar sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#/home">
                <i class="bi bi-airplane-engines text-primary me-2"></i>DronePilot
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Otvori meni">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul id="navLinks" class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="#/home">Početna</a></li>
                    <li class="nav-item"><a class="nav-link" href="#/home" data-section="usluge">Usluge</a></li>
                    <li class="nav-item"><a class="nav-link" href="#/home" data-section="dronovi">Dronovi</a></li>
                    <li class="nav-item"><a class="nav-link" href="#/home" data-section="vrijeme">Vrijeme za let</a></li>
                    <li id="navOrders" class="nav-item d-none"><a class="nav-link" href="#/admin?section=orders">Narudžbe</a></li>
                    <li id="navProfile" class="nav-item d-none"><a class="nav-link" href="#/profile">Profil</a></li>
                    <li id="navAdmin" class="nav-item d-none"><a class="nav-link" href="#/admin">Admin panel</a></li>
                </ul>
                <div id="authActions" class="d-flex flex-wrap gap-2 align-items-center py-2 py-lg-0">
                    <a id="loginBtn" href="#/login" class="btn btn-outline-light rounded-pill px-4">Prijava</a>
                    <a id="registerBtn" href="#/register" class="btn btn-primary rounded-pill px-4">Registracija</a>
                    <span id="userBadge" class="badge rounded-pill bg-light text-dark d-none">User</span>
                    <button id="logoutBtn" type="button" class="btn btn-outline-light rounded-pill px-4 d-none">Odjavi se</button>
                </div>
            </div>
        </div>
    </nav>

    <div id="app" aria-live="polite">
        <main class="container py-5 text-center" aria-busy="true">
            <p class="text-muted">Učitavanje stranice...</p>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="frontend/js/services/apiService.js"></script>
    <script src="frontend/js/services/weatherService.js"></script>
    <script src="frontend/js/services/adminService.js"></script>
    <script src="frontend/js/main.js"></script>
</body>
</html>
